name: notify-chain-e2e

services:
  stellar-rpc:
    image: node:22-alpine
    working_dir: /workspace
    command: ["node", "e2e-stellar-rpc.mjs"]
    volumes:
      - ./scripts/e2e-stellar-rpc.mjs:/workspace/e2e-stellar-rpc.mjs:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 10

  contract-tests:
    image: rust:1.86-slim
    working_dir: /workspace
    command: ["cargo", "test", "--workspace", "--all-features"]
    volumes:
      - ./contract:/workspace
      - contract_registry:/usr/local/cargo/registry
      - contract_git:/usr/local/cargo/git
      - contract_target:/workspace/target
    restart: "no"

  listener:
    environment:
      STELLAR_RPC_URL: http://stellar-rpc:8000
      STELLAR_NETWORK: standalone
      STELLAR_NETWORK_PASSPHRASE: Standalone Network ; February 2017
      CONTRACT_ADDRESSES: '[{"address":"CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4","events":["*"]}]'
      STELLAR_RPC_FALLBACK_URLS: "[]"
      DISCORD_WEBHOOK_URL: ""
      DISCORD_WEBHOOK_ID: ""
      API_KEYS: "[]"
      WEBHOOK_SECRETS: "[]"
      DATABASE_PATH: /app/data/notifications.db
      POLL_INTERVAL_MS: "5000"
    depends_on:
      stellar-rpc:
        condition: service_healthy
      contract-tests:
        condition: service_completed_successfully

  dashboard:
    build:
      args:
        VITE_EVENTS_API_URL: http://localhost:8787/api/events
        VITE_STELLAR_NETWORK: STANDALONE

volumes:
  contract_registry:
  contract_git:
  contract_target:

version: 2

updates:
  # Dashboard (frontend) npm dependencies
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(dashboard)"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      testing:
        patterns:
          - "@testing-library/*"
          - "jest"
          - "jest-*"
          - "ts-jest"
          - "@types/jest*"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "eslint*"
          - "typescript"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"

  # Listener npm dependencies
  - package-ecosystem: "npm"
    directory: "/listener"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "listener"
    commit-message:
      prefix: "chore(listener)"

  # Rust/Cargo contract dependencies
  - package-ecosystem: "cargo"
    directory: "/contract"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "contract"
    commit-message:
      prefix: "chore(contract)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"

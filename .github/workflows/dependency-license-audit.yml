name: Dependency License Compliance Audit

on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "scripts/audit-licenses.py"
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_dispatch:

concurrency:
  group: license-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  license-audit:
    name: audit-licenses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Dependency License Audit
        run: |
          python3 scripts/audit-licenses.py --warn-only

name: Frontend accessibility

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/frontend-accessibility.yml'
      - 'docs/accessibility-automation.md'
  push:
    branches: [main, master]
    paths:
      - 'dashboard/**'
      - '.github/workflows/frontend-accessibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Check shared components and representative page flows
        run: |
          mkdir -p accessibility-results
          set -o pipefail
          npm run test:a11y -- --ci --verbose --json --outputFile=accessibility-results/jest.json 2>&1 | tee accessibility-results/jest.txt
      - name: Preserve accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-accessibility-results
          path: dashboard/accessibility-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Record review scope
        if: always()
        run: |
          echo '### Frontend accessibility' >> "$GITHUB_STEP_SUMMARY"
          echo 'See the test log and frontend-accessibility-results artifact for rule IDs, affected elements, and remediation links. Automated DOM checks do not replace keyboard, screen-reader, zoom, contrast, or mobile browser review. See docs/accessibility-automation.md.' >> "$GITHUB_STEP_SUMMARY"
